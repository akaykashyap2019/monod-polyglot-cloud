version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: monod_user
      POSTGRES_PASSWORD: monod_password
      POSTGRES_DB: monod_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - monod-mesh

  order-service:
    image: monodakay/polyglot-order-service:latest
    container_name: order-service
    restart: always
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=monod_user
      - DB_PASSWORD=monod_password
      - DB_NAME=monod_db
      - PORT=5000
    depends_on:
      - postgres-db
    networks:
      - monod-mesh

  analytics-service:
    image: monodakay/polyglot-analytics-service:latest
    container_name: analytics-service
    restart: always
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=monod_user
      - DB_PASSWORD=monod_password
      - DB_NAME=monod_db
    depends_on:
      - postgres-db
    networks:
      - monod-mesh

  frontend:
    image: monodakay/polyglot-frontend:latest
    container_name: frontend-proxy
    restart: always
    ports:
      - "80:80"
    depends_on:
      - order-service
      - analytics-service
    networks:
      - monod-mesh

volumes:
  pgdata:

networks:
  monod-mesh:
    driver: bridge
