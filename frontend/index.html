<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MONOD Cloud Enterprise Suite</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%); color: #f8fafc; min-height: 100vh; padding: 2rem; display: flex; justify-content: center; align-items: center; position: relative; overflow-x: hidden; }
        .bg-watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-10deg); font-size: 16vw; font-weight: 900; letter-spacing: 0.25em; color: transparent; -webkit-text-stroke: 1.5px rgba(99, 102, 241, 0.08); user-select: none; pointer-events: none; z-index: 1; }
        .container { position: relative; z-index: 2; width: 100%; max-width: 800px; background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); padding: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }
        h1 { color: #38bdf8; font-size: 1.75rem; margin-bottom: 0.25rem; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
        .card { background: rgba(31, 41, 55, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); padding: 1.25rem; border-radius: 12px; }
        .card-label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; }
        .card-val { font-size: 1.6rem; font-weight: 700; color: #38bdf8; margin-top: 0.4rem; }
        .form-group { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
        input { flex: 1; padding: 0.75rem 1rem; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 0.95rem; }
        input:focus { border-color: #38bdf8; outline: none; }
        button { background: #4f46e5; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
        button:hover { background: #4338ca; }
        .table-wrap { max-height: 250px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 0.75rem 1rem; border-bottom: 1px solid #1f2937; }
        th { background: #1f2937; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="bg-watermark">MONOD</div>
    <div class="container">
        <h1>MONOD 3-Tier Enterprise Mesh</h1>
        <div class="subtitle">Polyglot Architecture: Nginx + Python Flask + Node.js + PostgreSQL</div>

        <div class="grid">
            <div class="card"><div class="card-label">Total Transactions</div><div class="card-val" id="total-count">0</div></div>
            <div class="card"><div class="card-label">Aggregated Revenue</div><div class="card-val" id="total-rev">$0</div></div>
            <div class="card"><div class="card-label">Average Order</div><div class="card-val" id="avg-ticket">$0</div></div>
        </div>

        <div class="form-group">
            <input type="text" id="itemName" placeholder="Item Name (e.g. Cloud Server Hosting)" />
            <input type="number" id="itemPrice" placeholder="Price ($)" step="0.01" />
            <button onclick="addOrder()">Submit Order</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>ID</th><th>Item Name</th><th>Price</th><th>Time</th></tr>
                </thead>
                <tbody id="ordersBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function fetchAll() {
            try {
                const [ordersRes, analyticsRes] = await Promise.all([
                    fetch('/api/orders'),
                    fetch('/api/analytics')
                ]);
                const orders = await ordersRes.json();
                const analytics = await analyticsRes.json();

                document.getElementById('total-count').innerText = analytics.total_orders || 0;
                document.getElementById('total-rev').innerText = '$' + (analytics.total_revenue || 0);
                document.getElementById('avg-ticket').innerText = '$' + (analytics.average_ticket || 0);

                const tbody = document.getElementById('ordersBody');
                tbody.innerHTML = orders.map(o => `
                    <tr>
                        <td>#${o.id}</td>
                        <td>${o.item_name}</td>
                        <td>$${parseFloat(o.price).toFixed(2)}</td>
                        <td>${new Date(o.created_at).toLocaleTimeString()}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Fetch error:", err);
            }
        }

        async function addOrder() {
            const name = document.getElementById('itemName').value.trim();
            const price = document.getElementById('itemPrice').value.trim();
            if (!name || !price) return;

            await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item_name: name, price: price })
            });

            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            fetchAll();
        }

        fetchAll();
        setInterval(fetchAll, 4000);
    </script>
</body>
</html>
