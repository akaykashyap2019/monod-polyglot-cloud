events {}
http {
    include /etc/nginx/mime.types;
    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/orders {
            proxy_pass http://order-service:5000;
        }

        location /api/analytics {
            proxy_pass http://analytics-service:5001;
        }
    }
}